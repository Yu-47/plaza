[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plaza"
version = "0.1.0"
description = "A real-time multiplayer pixel canvas server inspired by Reddit r/place"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools]
packages = ["plaza"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"